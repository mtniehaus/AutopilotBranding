name: Publish Autopilot Branding

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:

  build:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install PowerShell 7.6
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
        $releases = Invoke-RestMethod -Uri 'https://api.github.com/repos/PowerShell/PowerShell/releases?per_page=100' -Headers $headers
        $candidates = @($releases | Where-Object { $_.tag_name -match '^v7\.6\.' })
        $release = $candidates | Where-Object { -not $_.prerelease } | Select-Object -First 1
        if (-not $release) {
          Write-Warning 'No stable PowerShell 7.6 release found, using the latest 7.6 preview'
          $release = $candidates | Select-Object -First 1
        }
        if (-not $release) { throw 'No PowerShell 7.6 release found' }
        $asset = $release.assets | Where-Object { $_.name -like 'PowerShell-*-win-x64.zip' } | Select-Object -First 1
        $zip = Join-Path $env:RUNNER_TEMP 'pwsh76.zip'
        $folder = Join-Path $env:RUNNER_TEMP 'pwsh76'
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $folder -Force
        $exe = Join-Path $folder 'pwsh.exe'
        & $exe -NoProfile -Command '"Installed PowerShell $($PSVersionTable.PSVersion)"'
        "PWSH76=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Test with Windows PowerShell 5.1
      shell: cmd
      run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests\Test-AutopilotBranding.ps1

    - name: Test with PowerShell 7.6
      shell: cmd
      run: '"%PWSH76%" -NoProfile -ExecutionPolicy Bypass -File Tests\Test-AutopilotBranding.ps1'

    - name: Create Intune app
      shell: cmd
      run: |
        call MakeApp.cmd || exit /b 1
        mkdir Build
        copy AutopilotBranding.intunewin Build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AutopilotBranding
        path: |
          AutopilotBranding.intunewin
          Output
